# Starts the 4 boxes: db, mailpit, api, worker.
# Run with: docker compose up --build

services:
  # PostgreSQL with the pgvector extension (stores everything)
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the hub sends. View at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  # Web server: API + frontend pages. Open http://localhost:8000
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "cd /srv/backend &&
             if [ -f alembic.ini ]; then alembic upgrade head; fi &&
             if [ -f app/core/seed.py ]; then python -m app.core.seed; fi &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/backend/app"
    env_file: .env
    environment:
      CVS_DIR: /cvs
      INBOX_DIR: /inbox
      FRONTEND_DIR: /srv/frontend
      INTAKE_MAX_FILES: ${INTAKE_MAX_FILES:-0}
    volumes:
      - ./backend:/srv/backend
      - ./frontend:/srv/frontend
      - ./eval:/srv/eval
      - ${CVS_DIR}:/cvs:ro
      - ${INBOX_DIR}:/inbox
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Background worker: watches folders and runs the workflows
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "cd /srv/backend && sleep 5 && exec python -m app.worker"
    env_file: .env
    environment:
      CVS_DIR: /cvs
      INBOX_DIR: /inbox
      FRONTEND_DIR: /srv/frontend
      INTAKE_MAX_FILES: ${INTAKE_MAX_FILES:-0}
    volumes:
      - ./backend:/srv/backend
      - ./frontend:/srv/frontend
      - ${CVS_DIR}:/cvs:ro
      - ${INBOX_DIR}:/inbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata: