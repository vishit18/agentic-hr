{% extends "base.html" %}
{% block title %}Sign in · Cadence HR Hub{% endblock %}

{% block content %}
<section class="card login-card">
  <h1>Sign in</h1>
  <p class="muted">Use your Cadence HR account.</p>

  {% if error %}
  <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn-primary">Sign in</button>
  </form>
</section>
{% endblock %}
